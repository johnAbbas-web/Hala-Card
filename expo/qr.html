<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hala Card · Sierah Expo 2026 · Madinah is calling</title>
<link rel="icon" type="image/png" href="img/hala-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/expo.css?v=23">
<!-- Big-screen display (concept Option A · Cinematic Madinah). Open full-screen (F11) on the expo screen.
     Optional: ?url=https://your-domain/expo/ to encode a different address. -->
</head>
<body class="kiosk-page">
<div class="kx-photo" aria-hidden="true"><img src="img/madinah-wide.webp" alt=""></div>

<main class="kx">
  <section class="kx-left">
    <div class="kx-logos">
      <span class="logo logo-light kx-logo"><img src="img/hala-mark.png" alt=""><span>Card</span></span>
      <i class="kx-div" aria-hidden="true"></i>
      <span class="kx-expo">
        <svg viewBox="0 0 48 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8c6-3 14-3 20 2 6-5 14-5 20-2v20c-6-3-14-3-20 2-6-5-14-5-20-2z"/><path d="M24 10v20"/></svg>
        <b>Sierah</b><small>Expo</small>
      </span>
    </div>

    <h1 class="kx-title">Madinah<br><span>is calling.</span></h1>
    <p class="kx-sub">Your journey starts here.</p>

    <div class="kx-gift">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v9H5v-9M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
      <p><b>First <span data-limit>500</span></b><span>receive a</span><b>free gift</b></p>
    </div>

    <p class="kx-live" id="claim-label" hidden></p>
  </section>

  <section class="kx-right">
    <div class="kx-qr-frame">
      <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
      <div class="kx-qr" id="qr" role="img" aria-label="QR code to the Hala Card Sierah Expo page"></div>
    </div>
    <p class="kx-cap">Scan to unlock your<br>exclusive access</p>
    <p class="kx-noapp">No app needed · takes 30 seconds</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" crossorigin="anonymous"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var target = params.get('url') || new URL('./?src=qr', location.href).href;
  var box = document.getElementById('qr');
  if (window.qrcode) {
    var qr = qrcode(0, 'H');
    qr.addData(target); qr.make();
    box.innerHTML = qr.createSvgTag({ cellSize: 10, margin: 0, scalable: true });
    box.querySelectorAll('path,rect').forEach(function (p) { if (p.getAttribute('fill') === '#000000') p.setAttribute('fill', '#0A2B1A'); });
  } else {
    box.innerHTML = '<p style="color:#0A2B1A;font-size:1.4rem;text-align:center;word-break:break-all">' + target + '</p>';
  }
  function refresh() {
    fetch('api/pass.php?stats=1').then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) return;
      var el = document.getElementById('claim-label');
      el.innerHTML = d.remaining > 0
        ? '<i></i><b>' + d.remaining + '</b> of ' + d.limit + ' gifts still available'
        : 'All ' + d.limit + ' gifts claimed. Scan to join the launch list';
      el.hidden = false;
      document.querySelectorAll('[data-limit]').forEach(function (n) { n.textContent = d.limit; });
    }).catch(function () {});
  }
  refresh(); setInterval(refresh, 30000);
})();
</script>
</body>
</html>
