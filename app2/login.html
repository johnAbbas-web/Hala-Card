<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#061506" />
  <title>Hala — Sign In</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.json" />

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 28px 40px;
      position: relative;
      z-index: 1;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 36px;
      animation: fadeUp 0.7s ease forwards;
      opacity: 0;
    }

    .auth-form {
      animation: fadeUp 0.7s 0.15s ease forwards;
      opacity: 0;
    }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      animation: fadeUp 0.7s 0.3s ease forwards;
      opacity: 0;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .google-btn svg { width: 18px; height: 18px; }

    .forgot-link {
      text-align: right;
      font-size: 11px;
      color: rgba(180,145,60,0.4);
      cursor: pointer;
      margin-top: -8px;
      margin-bottom: 20px;
      transition: color 0.2s;
    }
    .forgot-link:hover { color: var(--gold-dim); }

    .switch-text {
      font-size: 12px;
      color: rgba(180,145,60,0.35);
    }
    .switch-link {
      color: rgba(180,145,60,0.75);
      cursor: pointer;
      text-decoration: underline;
      transition: color 0.2s;
    }
    .switch-link:hover { color: var(--gold); }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: rgba(180,145,60,0.28);
      text-decoration: none;
      letter-spacing: 0.06em;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--gold-dim); }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6,21,6,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .loading-overlay.show { opacity: 1; pointer-events: all; }
  </style>
</head>
<body>
  <div class="hala-bg">
    <div class="arabesque"></div>

    <div class="auth-page">

      <!-- Header -->
      <div class="auth-header">
        <a href="welcome.html" style="display:inline-block; margin-bottom:28px;">
          <img src="assets/logo.png" alt="Hala" style="width:52px; height:52px; object-fit:contain; opacity:0.85;" />
        </a>
        <div class="section-eyebrow">Welcome back</div>
        <div class="section-title">Sign In</div>
        <div class="gold-rule" style="margin-top:10px;"></div>
      </div>

      <!-- Form -->
      <div class="auth-form">
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input class="form-input" type="email" id="email" placeholder="your@email.com" autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <div class="forgot-link" onclick="forgotPassword()">Forgot password?</div>

        <button class="btn-gold" onclick="signIn()">Sign In</button>

        <div class="divider">
          <div class="divider-line"></div>
          <span class="divider-text">or continue with</span>
          <div class="divider-line"></div>
        </div>

        <button class="btn-ghost google-btn" onclick="signInGoogle()">
          <svg viewBox="0 0 18 18" fill="none">
            <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#c9a84c" opacity="0.7"/>
            <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#c9a84c" opacity="0.5"/>
            <path d="M3.964 10.706c-.18-.54-.282-1.117-.282-1.706s.102-1.166.282-1.706V4.962H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.038l3.007-2.332z" fill="#c9a84c" opacity="0.4"/>
            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.962L3.964 6.294C4.672 4.16 6.656 3.58 9 3.58z" fill="#c9a84c" opacity="0.65"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <!-- Footer -->
      <div class="auth-footer">
        <div class="switch-text">
          Don't have an account?
          <span class="switch-link" onclick="window.location.href='signup.html'">Create one</span>
        </div>
        <a href="welcome.html" class="back-link">← Back</a>
      </div>

    </div>
  </div>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // Redirect if already logged in
    auth.onAuthStateChanged(user => {
      if (user && !user.isAnonymous) window.location.href = 'home.html';
    });

    function setLoading(on) {
      document.getElementById('loadingOverlay').classList.toggle('show', on);
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast' + (isError ? ' error' : '');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    async function signIn() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) return showToast('Please fill in all fields.', true);

      setLoading(true);
      try {
        await auth.signInWithEmailAndPassword(email, password);
        window.location.href = 'home.html';
      } catch (err) {
        setLoading(false);
        const msgs = {
          'auth/user-not-found':  'No account found with this email.',
          'auth/wrong-password':  'Incorrect password.',
          'auth/invalid-email':   'Please enter a valid email.',
          'auth/too-many-requests': 'Too many attempts. Try again later.'
        };
        showToast(msgs[err.code] || 'Sign-in failed. Please try again.', true);
      }
    }

    async function signInGoogle() {
      setLoading(true);
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const result = await auth.signInWithPopup(provider);
        await ensureUserProfile(result.user);
        window.location.href = 'home.html';
      } catch (err) {
        setLoading(false);
        showToast('Google sign-in failed.', true);
      }
    }

    async function forgotPassword() {
      const email = document.getElementById('email').value.trim();
      if (!email) return showToast('Enter your email above first.', true);
      try {
        await auth.sendPasswordResetEmail(email);
        showToast('Reset link sent — check your email.');
      } catch (err) {
        showToast('Could not send reset email.', true);
      }
    }

    // Allow Enter key to submit
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') signIn();
    });
  </script>
</body>
</html>
