<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#061506" />
  <title>Hala — Pass</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.json" />

  <style>
    body { overflow-x: hidden; }

    .pass-page {
      min-height: 100vh;
      padding: 70px 0 100px;
    }

    /* ---------- Page header ---------- */
    .page-header {
      padding: 0 22px 24px;
      border-bottom: 1px solid rgba(180,145,60,0.08);
      margin-bottom: 28px;
    }

    /* ---------- Digital card ---------- */
    .card-wrap {
      padding: 0 20px;
      margin-bottom: 32px;
      animation: cardReveal 0.8s ease forwards;
      opacity: 0;
    }

    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .hala-pass-card {
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(135deg, #0d3010 0%, #1a5520 35%, #0d3d12 65%, #071a07 100%);
      border: 1px solid rgba(180,145,60,0.35);
      padding: 28px 26px;
      min-height: 200px;
    }

    /* Decorative elements on card */
    .card-circle-1 {
      position: absolute;
      top: -40px; right: -40px;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(180,145,60,0.12) 0%, transparent 70%);
    }

    .card-circle-2 {
      position: absolute;
      bottom: -60px; left: -30px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(26,85,32,0.5) 0%, transparent 70%);
    }

    .card-pattern {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      background-image:
        repeating-linear-gradient(30deg, rgba(180,145,60,0.5) 0px, transparent 1px, transparent 16px, rgba(180,145,60,0.5) 17px),
        repeating-linear-gradient(-30deg, rgba(180,145,60,0.5) 0px, transparent 1px, transparent 16px, rgba(180,145,60,0.5) 17px);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
    }

    .card-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 300;
      letter-spacing: 0.12em;
      color: var(--gold);
      line-height: 1;
    }

    .card-brand-sub {
      font-size: 9px;
      letter-spacing: 0.4em;
      color: rgba(180,145,60,0.5);
      text-transform: uppercase;
      margin-top: 3px;
    }

    .card-badge {
      background: rgba(180,145,60,0.15);
      border: 1px solid rgba(180,145,60,0.35);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--gold-dim);
      text-transform: uppercase;
    }

    .card-bottom {
      position: relative;
      z-index: 1;
    }

    .card-member-label {
      font-size: 9px;
      letter-spacing: 0.3em;
      color: rgba(180,145,60,0.4);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .card-member-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 300;
      color: rgba(220,200,150,0.9);
      letter-spacing: 0.06em;
    }

    .card-meta {
      display: flex;
      gap: 24px;
      margin-top: 16px;
    }

    .card-meta-item { }
    .card-meta-label {
      font-size: 8px;
      letter-spacing: 0.25em;
      color: rgba(180,145,60,0.38);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .card-meta-value {
      font-size: 13px;
      color: rgba(180,145,60,0.7);
      letter-spacing: 0.06em;
    }

    .gold-chip {
      position: absolute;
      bottom: 28px; right: 26px;
      width: 40px; height: 30px;
      border-radius: 4px;
      background: linear-gradient(135deg, #e8c96a, #c9a84c, #8a6820);
      opacity: 0.7;
    }

    /* ---------- Show to staff instruction ---------- */
    .staff-note {
      margin: 0 20px 28px;
      padding: 14px 16px;
      background: rgba(180,145,60,0.06);
      border: 1px solid rgba(180,145,60,0.14);
      border-radius: 14px;
      font-size: 12px;
      color: rgba(180,145,60,0.5);
      text-align: center;
      line-height: 1.6;
    }

    /* ---------- Partner offers list ---------- */
    .offers-section {
      padding: 0 20px;
    }

    .section-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .offer-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(180,145,60,0.12);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      gap: 14px;
      align-items: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .offer-card:hover { border-color: rgba(180,145,60,0.3); }

    .offer-icon {
      width: 50px; height: 50px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(180,145,60,0.12), rgba(26,74,26,0.4));
      border: 1px solid rgba(180,145,60,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .offer-icon img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 13px;
    }

    .offer-body { flex: 1; }

    .offer-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      font-weight: 400;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .offer-benefit {
      font-size: 11px;
      color: var(--gold-dim);
      margin-bottom: 4px;
    }

    .offer-cat {
      font-size: 9px;
      letter-spacing: 0.2em;
      color: rgba(180,145,60,0.35);
      text-transform: uppercase;
    }

    .offer-arrow {
      color: rgba(180,145,60,0.3);
      font-size: 20px;
    }

    .empty-offers {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="hala-bg">
    <div class="arabesque"></div>

    <div class="pass-page">

      <!-- Header -->
      <div class="page-header">
        <div class="section-eyebrow" style="text-align:left; margin-top:4px;">Exclusive Access</div>
        <div class="section-title" style="text-align:left;">Hala Pass</div>
      </div>

      <!-- Digital Card -->
      <div class="card-wrap">
        <div class="hala-pass-card">
          <div class="card-pattern"></div>
          <div class="card-circle-1"></div>
          <div class="card-circle-2"></div>

          <div class="card-top">
            <div>
              <div class="card-brand">Hala</div>
              <div class="card-brand-sub">Discovery Pass</div>
            </div>
            <div class="card-badge">Active</div>
          </div>

          <div class="card-bottom">
            <div class="card-member-label">Member</div>
            <div class="card-member-name" id="cardName">Loading…</div>

            <div class="card-meta">
              <div class="card-meta-item">
                <div class="card-meta-label">Valid</div>
                <div class="card-meta-value">2025 Season</div>
              </div>
              <div class="card-meta-item">
                <div class="card-meta-label">City</div>
                <div class="card-meta-value">Madinah</div>
              </div>
              <div class="card-meta-item">
                <div class="card-meta-label">Partners</div>
                <div class="card-meta-value" id="partnerCount">–</div>
              </div>
            </div>

            <div class="gold-chip"></div>
          </div>
        </div>
      </div>

      <!-- Staff instruction -->
      <div class="staff-note">
        Show this card to staff at any Hala partner location to redeem your exclusive offer.
      </div>

      <!-- Partner Offers -->
      <div class="offers-section">
        <div class="section-row">
          <div class="section-label">Partner Offers</div>
        </div>
        <div id="offersList">
          <!-- Populated by JS -->
          <div style="height:80px; border-radius:18px; margin-bottom:12px;" class="skeleton"></div>
          <div style="height:80px; border-radius:18px; margin-bottom:12px;" class="skeleton"></div>
          <div style="height:80px; border-radius:18px;" class="skeleton"></div>
        </div>
      </div>

    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="home.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(180,145,60,0.35)" stroke-width="1.5">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9,22 9,12 15,12 15,22"/>
        </svg>
        <span class="nav-label">Home</span>
      </a>
      <a href="map.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(180,145,60,0.35)" stroke-width="1.5">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <span class="nav-label">Map</span>
      </a>
      <a href="pass.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(180,145,60,0.9)" stroke-width="1.5">
          <rect x="2" y="7" width="20" height="14" rx="2"/>
          <path d="M16 7V5a2 2 0 00-4 0v2M12 12v4M10 14h4"/>
        </svg>
        <span class="nav-label" style="color:var(--gold);">Pass</span>
      </a>
      <a href="profile.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(180,145,60,0.35)" stroke-width="1.5">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="nav-label">Profile</span>
      </a>
    </nav>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    auth.onAuthStateChanged(async user => {
      if (!user) { window.location.href = 'welcome.html'; return; }

      const name = user.displayName || user.email?.split('@')[0] || 'Guest';
      document.getElementById('cardName').textContent = name;

      loadOffers();
    });

    async function loadOffers() {
      const snap = await db.collection('locations').where('halaOffer', '!=', '').get();
      const locations = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      document.getElementById('partnerCount').textContent = locations.length;

      const list = document.getElementById('offersList');

      if (locations.length === 0) {
        list.innerHTML = `
          <div class="empty-offers">
            Partner offers are being added soon.<br />Check back shortly.
          </div>
        `;
        return;
      }

      list.innerHTML = locations.map(loc => `
        <div class="offer-card" onclick="window.location.href='location.html?id=${loc.id}'">
          <div class="offer-icon">
            ${loc.imageURL
              ? `<img src="${loc.imageURL}" alt="${loc.name}" />`
              : `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(180,145,60,0.4)" stroke-width="1.5">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
                  <circle cx="12" cy="10" r="3"/>
                </svg>`
            }
          </div>
          <div class="offer-body">
            <div class="offer-name">${loc.name}</div>
            <div class="offer-benefit">${loc.halaOffer}</div>
            <div class="offer-cat">${loc.category || ''}</div>
          </div>
          <div class="offer-arrow">›</div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
