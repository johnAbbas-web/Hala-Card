<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#061506" />
  <title>Hala — Discover</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.json" />

  <!-- Mapbox for the preview map -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>

  <style>
    body { overflow-x: hidden; }

    /* ---------- Header ---------- */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      padding: 16px 22px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(6,21,6,0.97) 0%, transparent 100%);
    }

    .top-bar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-bar-logo img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(180,145,60,0.3));
    }

    .top-bar-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 0.14em;
      color: var(--gold);
    }

    .avatar-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(180,145,60,0.15);
      border: 1px solid rgba(180,145,60,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--gold);
      letter-spacing: 0;
      text-decoration: none;
      transition: border-color 0.2s;
    }
    .avatar-btn:hover { border-color: var(--gold); }

    /* ---------- Map Preview ---------- */
    .map-preview-section {
      padding-top: 70px;
      position: relative;
    }

    .map-preview-container {
      position: relative;
      height: 230px;
      overflow: hidden;
    }

    #homeMap {
      width: 100%;
      height: 100%;
    }

    .map-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(6,21,6,0.7) 100%);
      pointer-events: none;
    }

    .map-tap-btn {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(10,25,10,0.9);
      border: 1px solid rgba(180,145,60,0.35);
      border-radius: 24px;
      padding: 8px 18px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: var(--gold);
      text-transform: uppercase;
      text-decoration: none;
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .map-tap-btn:hover { border-color: var(--gold); }

    .map-pin-count {
      position: absolute;
      bottom: 16px;
      left: 16px;
      font-size: 11px;
      color: rgba(180,145,60,0.6);
      letter-spacing: 0.08em;
      background: rgba(10,25,10,0.75);
      border-radius: 20px;
      padding: 6px 14px;
      backdrop-filter: blur(8px);
    }

    /* ---------- Scroll content ---------- */
    .home-content {
      padding: 0 0 90px;
      background: linear-gradient(to bottom, transparent 0%, #061506 200px);
    }

    /* ---------- Search bar ---------- */
    .search-section {
      padding: 20px 18px 0;
    }

    .search-wrap {
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(180,145,60,0.4);
    }

    .search-input {
      width: 100%;
      padding: 13px 16px 13px 42px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(180,145,60,0.18);
      border-radius: 50px;
      font-family: 'Tajawal', sans-serif;
      font-size: 13px;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input::placeholder { color: rgba(180,145,60,0.25); }
    .search-input:focus { border-color: rgba(180,145,60,0.4); }

    /* ---------- Category chips ---------- */
    .section-pad { padding: 24px 18px 0; }

    .section-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .chips-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .chips-scroll::-webkit-scrollbar { display: none; }

    .chip {
      flex-shrink: 0;
      padding: 8px 18px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(180,145,60,0.18);
      border-radius: 50px;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: rgba(180,145,60,0.55);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .chip:hover,
    .chip.active {
      background: rgba(180,145,60,0.12);
      border-color: rgba(180,145,60,0.4);
      color: var(--gold);
    }

    /* ---------- Location cards (horizontal scroll) ---------- */
    .cards-scroll {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 0 18px 4px;
      scrollbar-width: none;
    }
    .cards-scroll::-webkit-scrollbar { display: none; }

    .loc-card {
      flex-shrink: 0;
      width: 200px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(180,145,60,0.14);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
      text-decoration: none;
    }
    .loc-card:hover { border-color: rgba(180,145,60,0.35); transform: translateY(-2px); }

    .loc-card-img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
      background: rgba(180,145,60,0.08);
    }

    .loc-card-img-placeholder {
      width: 100%;
      height: 120px;
      background: linear-gradient(135deg, rgba(180,145,60,0.08) 0%, rgba(26,74,26,0.4) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loc-card-body { padding: 12px 14px 14px; }

    .loc-card-cat {
      font-size: 9px;
      letter-spacing: 0.22em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .loc-card-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 17px;
      font-weight: 400;
      color: var(--text-primary);
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .loc-card-dist {
      font-size: 11px;
      color: rgba(180,145,60,0.4);
    }

    /* ---------- Hala Pass banner ---------- */
    .pass-banner {
      margin: 24px 18px 0;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      text-decoration: none;
      display: block;
    }

    .pass-banner-inner {
      background: linear-gradient(135deg, #0d3010 0%, #1a5a20 50%, #0d3010 100%);
      border: 1px solid rgba(180,145,60,0.3);
      border-radius: 20px;
      padding: 22px 24px;
      position: relative;
      overflow: hidden;
    }

    .pass-banner-inner::before {
      content: '';
      position: absolute;
      top: -30px; right: -30px;
      width: 120px; height: 120px;
      border-radius: 50%;
      background: rgba(180,145,60,0.07);
    }

    .pass-eyebrow {
      font-size: 9px;
      letter-spacing: 0.4em;
      color: rgba(180,145,60,0.55);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .pass-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 300;
      color: var(--gold);
      letter-spacing: 0.06em;
    }

    .pass-subtitle {
      font-size: 12px;
      color: rgba(180,145,60,0.5);
      margin-top: 4px;
    }

    .pass-arrow {
      position: absolute;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(180,145,60,0.5);
      font-size: 24px;
    }

    /* ---------- Loading skeleton ---------- */
    .skeleton {
      background: linear-gradient(90deg, rgba(180,145,60,0.06) 25%, rgba(180,145,60,0.12) 50%, rgba(180,145,60,0.06) 75%);
      background-size: 200% 100%;
      animation: skeletonAnim 1.5s infinite;
      border-radius: 8px;
    }
    @keyframes skeletonAnim {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div class="hala-bg">
    <div class="arabesque"></div>

    <!-- Top Bar -->
    <div class="top-bar">
      <div class="top-bar-logo">
        <img src="assets/logo.png" alt="Hala" />
        <span class="top-bar-name">Hala</span>
      </div>
      <a href="profile.html" class="avatar-btn" id="avatarBtn">?</a>
    </div>

    <!-- Map Preview -->
    <div class="map-preview-section">
      <div class="map-preview-container">
        <div id="homeMap"></div>
        <div class="map-overlay"></div>
        <div class="map-pin-count" id="pinCount">Loading spots…</div>
        <a href="map.html" class="map-tap-btn">Explore Map →</a>
      </div>
    </div>

    <!-- Scrollable Content -->
    <div class="home-content">

      <!-- Search -->
      <div class="search-section">
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input class="search-input" type="text" id="searchInput" placeholder="Search locations…" oninput="filterLocations()" />
        </div>
      </div>

      <!-- Categories -->
      <div class="section-pad">
        <div class="section-label">Explore by category</div>
        <div class="chips-scroll">
          <div class="chip active" onclick="filterByCategory('all', this)">All</div>
          <div class="chip" onclick="filterByCategory('Masjid', this)">Masjids</div>
          <div class="chip" onclick="filterByCategory('Experience', this)">Experiences</div>
          <div class="chip" onclick="filterByCategory('Café', this)">Cafés</div>
          <div class="chip" onclick="filterByCategory('Restaurant', this)">Restaurants</div>
          <div class="chip" onclick="filterByCategory('Culture', this)">Culture</div>
          <div class="chip" onclick="filterByCategory('Shopping', this)">Shopping</div>
          <div class="chip" onclick="filterByCategory('Dessert', this)">Desserts</div>
        </div>
      </div>

      <!-- Featured locations -->
      <div class="section-pad">
        <div class="section-label">Top destinations</div>
        <div class="cards-scroll" id="locationsScroll">
          <!-- Populated by JS -->
          <div style="width:200px; height:180px;" class="skeleton"></div>
          <div style="width:200px; height:180px;" class="skeleton"></div>
          <div style="width:200px; height:180px;" class="skeleton"></div>
        </div>
      </div>

      <!-- Hala Pass Banner -->
      <a href="pass.html" class="pass-banner">
        <div class="pass-banner-inner">
          <div class="pass-eyebrow">Exclusive access</div>
          <div class="pass-title">Hala Pass</div>
          <div class="pass-subtitle">Unlock offers at partner locations</div>
          <div class="pass-arrow">›</div>
        </div>
      </a>

    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="home.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(180,145,60,0.9)" stroke-width="1.5">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9,22 9,12 15,12 15,22"/>
        </svg>
        <span class="nav-label" style="color:var(--gold);">Home</span>
      </a>
      <a href="map.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(180,145,60,0.35)" stroke-width="1.5">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <span class="nav-label">Map</span>
      </a>
      <a href="pass.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(180,145,60,0.35)" stroke-width="1.5">
          <rect x="2" y="7" width="20" height="14" rx="2"/>
          <path d="M16 7V5a2 2 0 00-4 0v2M12 12v4M10 14h4"/>
        </svg>
        <span class="nav-label">Pass</span>
      </a>
      <a href="profile.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(180,145,60,0.35)" stroke-width="1.5">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="nav-label">Profile</span>
      </a>
    </nav>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>

  <script src="js/mapbox-token.js"></script>
<script>
    // ---- Replace with your actual Mapbox token ----
    const MAPBOX_TOKEN = window.MAPBOX_TOKEN || ''; // set in js/mapbox-token.js (not in git)

    let allLocations = [];
    let currentCategory = 'all';
    let map;

    // ---------- Init ----------
    auth.onAuthStateChanged(user => {
      if (!user) { window.location.href = 'welcome.html'; return; }

      // Set avatar initials
      const name = user.displayName || user.email || 'G';
      document.getElementById('avatarBtn').textContent = name.charAt(0).toUpperCase();

      initMap();
      loadLocations();
    });

    // ---------- Map ----------
    function initMap() {
      mapboxgl.accessToken = MAPBOX_TOKEN;
      map = new mapboxgl.Map({
        container: 'homeMap',
        style: 'mapbox://styles/mapbox/dark-v11',
        center: [39.6142, 24.4686], // Madinah
        zoom: 12,
        interactive: false,
        attributionControl: false
      });

      map.on('load', () => {
        map.setPaintProperty('background', 'background-color', '#061a06');
      });
    }

    // ---------- Load locations from Firestore ----------
    async function loadLocations() {
      try {
        const snap = await db.collection('locations').orderBy('featured', 'desc').limit(20).get();
        allLocations = snap.docs.map(d => ({ id: d.id, ...d.data() }));

        document.getElementById('pinCount').textContent = `${allLocations.length} curated spots`;

        // Add pins to preview map
        allLocations.forEach(loc => {
          if (!loc.coordinates) return;
          new mapboxgl.Marker({ color: '#c9a84c', scale: 0.7 })
            .setLngLat([loc.coordinates.lng, loc.coordinates.lat])
            .addTo(map);
        });

        renderCards(allLocations);
      } catch (err) {
        console.error('Error loading locations:', err);
        renderCards([]);
      }
    }

    // ---------- Render location cards ----------
    function renderCards(locations) {
      const container = document.getElementById('locationsScroll');

      if (locations.length === 0) {
        container.innerHTML = `<div style="padding:20px; color:var(--text-muted); font-size:13px;">No locations found.</div>`;
        return;
      }

      container.innerHTML = locations.map(loc => `
        <div class="loc-card" onclick="openLocation('${loc.id}')">
          ${loc.imageURL
            ? `<img class="loc-card-img" src="${loc.imageURL}" alt="${loc.name}" loading="lazy" />`
            : `<div class="loc-card-img-placeholder">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="rgba(180,145,60,0.3)" stroke-width="1.2">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>
                </svg>
              </div>`
          }
          <div class="loc-card-body">
            <div class="loc-card-cat">${loc.category || 'Destination'}</div>
            <div class="loc-card-name">${loc.name}</div>
            <div class="loc-card-dist" id="dist-${loc.id}">
              ${loc.coordinates ? 'Calculating…' : loc.address || ''}
            </div>
          </div>
        </div>
      `).join('');

      // Calculate distances from user's location
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          const userLat = pos.coords.latitude;
          const userLng = pos.coords.longitude;
          locations.forEach(loc => {
            if (!loc.coordinates) return;
            const dist = getDistanceKm(userLat, userLng, loc.coordinates.lat, loc.coordinates.lng);
            const el = document.getElementById(`dist-${loc.id}`);
            if (el) el.textContent = `${dist < 1 ? (dist * 1000).toFixed(0) + ' m' : dist.toFixed(1) + ' km'} away`;
          });
        }, () => {
          locations.forEach(loc => {
            const el = document.getElementById(`dist-${loc.id}`);
            if (el) el.textContent = loc.address || '';
          });
        });
      }
    }

    // ---------- Haversine distance ----------
    function getDistanceKm(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // ---------- Category filter ----------
    function filterByCategory(cat, el) {
      currentCategory = cat;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      applyFilters();
    }

    // ---------- Search filter ----------
    function filterLocations() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      let filtered = allLocations;

      if (currentCategory !== 'all') {
        filtered = filtered.filter(l => l.category === currentCategory);
      }

      if (query) {
        filtered = filtered.filter(l =>
          l.name?.toLowerCase().includes(query) ||
          l.category?.toLowerCase().includes(query) ||
          l.description?.toLowerCase().includes(query)
        );
      }

      renderCards(filtered);
    }

    // ---------- Open location detail ----------
    function openLocation(id) {
      window.location.href = `location.html?id=${id}`;
    }
  </script>
</body>
</html>
