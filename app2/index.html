<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#061506" />
  <title>Hala</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

  <style>
    body { overflow: hidden; }

    .splash-page {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .logo-img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      filter: drop-shadow(0 0 24px rgba(180,145,60,0.4));
      animation: logoReveal 1.2s ease forwards;
      opacity: 0;
    }

    .logo-text {
      animation: logoReveal 1.2s 0.3s ease forwards;
      opacity: 0;
    }

    .logo-sub {
      animation: logoReveal 1.2s 0.6s ease forwards;
      opacity: 0;
    }

    @keyframes logoReveal {
      0%   { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .bottom-line {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      transform: scaleX(0);
      transform-origin: center;
      animation: lineExpand 1.5s 0.8s ease forwards;
    }

    @keyframes lineExpand {
      0%   { transform: scaleX(0); opacity: 0; }
      50%  { opacity: 0.7; }
      100% { transform: scaleX(1); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="hala-bg">
    <div class="arabesque"></div>

    <div class="splash-page">
      <!-- Replace logo.png with your actual logo file -->
      <img src="assets/logo.png" alt="Hala" class="logo-img" />
      <div class="logo-text" style="font-family:'Cormorant Garamond',serif; font-size:50px; font-weight:300; letter-spacing:0.18em; color:var(--gold); margin-top:12px;">Hala</div>
      <div class="logo-sub" style="font-size:9px; letter-spacing:0.5em; color:var(--text-muted); text-transform:uppercase; margin-top:6px;">Discover · Madinah</div>
    </div>

    <div class="bottom-line"></div>
  </div>

  <script>
    // Auto-navigate to welcome screen after splash
    window.addEventListener('load', () => {
      setTimeout(() => {
        window.location.href = 'welcome.html';
      }, 2800);
    });
  </script>
</body>
</html>
