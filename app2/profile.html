<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#061506" />
  <title>Hala — Profile</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.json" />

  <style>
    body { overflow-x: hidden; }

    .profile-page {
      min-height: 100vh;
      padding: 70px 0 100px;
    }

    /* ---------- Hero ---------- */
    .profile-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 22px 28px;
      border-bottom: 1px solid rgba(180,145,60,0.08);
      margin-bottom: 24px;
    }

    .avatar-ring {
      width: 84px; height: 84px;
      border-radius: 50%;
      background: rgba(180,145,60,0.1);
      border: 1.5px solid rgba(180,145,60,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }

    .avatar-ring img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .avatar-initial {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px;
      font-weight: 300;
      color: var(--gold);
    }

    .profile-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 300;
      color: var(--text-primary);
      letter-spacing: 0.05em;
      text-align: center;
      margin-bottom: 4px;
    }

    .profile-email {
      font-size: 12px;
      color: rgba(180,145,60,0.4);
      text-align: center;
    }

    .pass-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(180,145,60,0.1);
      border: 1px solid rgba(180,145,60,0.25);
      border-radius: 20px;
      padding: 6px 16px;
      margin-top: 14px;
      font-size: 11px;
      color: var(--gold-dim);
      letter-spacing: 0.1em;
    }

    .pass-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #2ecc71;
    }

    /* ---------- Stats row ---------- */
    .stats-row {
      display: flex;
      gap: 1px;
      margin: 0 20px 24px;
      background: rgba(180,145,60,0.08);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(180,145,60,0.1);
    }

    .stat-item {
      flex: 1;
      padding: 16px 8px;
      text-align: center;
      background: rgba(255,255,255,0.02);
    }

    .stat-number {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 300;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 9px;
      letter-spacing: 0.2em;
      color: rgba(180,145,60,0.4);
      text-transform: uppercase;
    }

    /* ---------- Saved locations ---------- */
    .section-pad { padding: 0 20px; }

    .saved-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .saved-card {
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(180,145,60,0.12);
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .saved-card:hover { border-color: rgba(180,145,60,0.3); }

    .saved-img {
      width: 100%; height: 90px;
      object-fit: cover;
      display: block;
      background: rgba(180,145,60,0.06);
    }

    .saved-img-ph {
      width: 100%; height: 90px;
      background: linear-gradient(135deg, rgba(180,145,60,0.08), rgba(26,74,26,0.3));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .saved-body { padding: 10px; }
    .saved-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      color: var(--text-primary);
      line-height: 1.3;
    }
    .saved-cat {
      font-size: 9px;
      color: rgba(180,145,60,0.4);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ---------- Menu items ---------- */
    .menu-section {
      padding: 0 20px;
      margin-top: 28px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 0;
      border-bottom: 1px solid rgba(180,145,60,0.07);
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .menu-item:hover { opacity: 0.75; }
    .menu-item:last-child { border-bottom: none; }

    .menu-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: rgba(180,145,60,0.08);
      border: 1px solid rgba(180,145,60,0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .menu-label {
      flex: 1;
      font-size: 14px;
      color: var(--text-primary);
      letter-spacing: 0.02em;
    }

    .menu-chevron { color: rgba(180,145,60,0.3); font-size: 18px; }

    .menu-item.danger .menu-label { color: rgba(220,100,100,0.7); }
    .menu-item.danger .menu-icon {
      background: rgba(220,80,80,0.07);
      border-color: rgba(220,80,80,0.15);
    }

    .empty-saved {
      text-align: center;
      padding: 28px 0;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.7;
    }
    .empty-saved a { color: var(--gold-dim); }
  </style>
</head>
<body>
  <div class="hala-bg">
    <div class="arabesque"></div>

    <div class="profile-page">

      <!-- Profile hero -->
      <div class="profile-hero">
        <div class="avatar-ring" id="avatarRing">
          <span class="avatar-initial" id="avatarInitial">?</span>
        </div>
        <div class="profile-name" id="profileName">Loading…</div>
        <div class="profile-email" id="profileEmail"></div>
        <div class="pass-pill">
          <div class="pass-dot"></div>
          Hala Pass — Active
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-number" id="savedCount">0</div>
          <div class="stat-label">Saved</div>
        </div>
        <div class="stat-item" style="border-left:1px solid rgba(180,145,60,0.08); border-right:1px solid rgba(180,145,60,0.08);">
          <div class="stat-number" id="partnerCount">–</div>
          <div class="stat-label">Partners</div>
        </div>
        <div class="stat-item">
          <div class="stat-number">1</div>
          <div class="stat-label">Pass</div>
        </div>
      </div>

      <!-- Saved Locations -->
      <div class="section-pad">
        <div class="section-label">Saved Locations</div>
        <div class="saved-grid" id="savedGrid">
          <div style="height:150px; border-radius:14px;" class="skeleton"></div>
          <div style="height:150px; border-radius:14px;" class="skeleton"></div>
        </div>
      </div>

      <!-- Menu -->
      <div class="menu-section">

        <div class="menu-item" onclick="window.location.href='map.html'">
          <div class="menu-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(180,145,60,0.6)" stroke-width="1.5">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
          </div>
          <span class="menu-label">Explore Map</span>
          <span class="menu-chevron">›</span>
        </div>

        <div class="menu-item" onclick="window.location.href='pass.html'">
          <div class="menu-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(180,145,60,0.6)" stroke-width="1.5">
              <rect x="2" y="7" width="20" height="14" rx="2"/>
              <path d="M16 7V5a2 2 0 00-4 0v2"/>
            </svg>
          </div>
          <span class="menu-label">Hala Pass</span>
          <span class="menu-chevron">›</span>
        </div>

        <div class="menu-item">
          <div class="menu-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(180,145,60,0.6)" stroke-width="1.5">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.07 4.93A10 10 0 0 1 22 12a10 10 0 0 1-10 10A10 10 0 0 1 2 12 10 10 0 0 1 12 2"/>
            </svg>
          </div>
          <span class="menu-label">About Hala</span>
          <span class="menu-chevron">›</span>
        </div>

        <div class="menu-item danger" onclick="signOutUser()">
          <div class="menu-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(220,100,100,0.6)" stroke-width="1.5">
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
            </svg>
          </div>
          <span class="menu-label">Sign Out</span>
          <span class="menu-chevron" style="color:rgba(220,100,100,0.3);">›</span>
        </div>

      </div>

    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="home.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(180,145,60,0.35)" stroke-width="1.5">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9,22 9,12 15,12 15,22"/>
        </svg>
        <span class="nav-label">Home</span>
      </a>
      <a href="map.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(180,145,60,0.35)" stroke-width="1.5">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <span class="nav-label">Map</span>
      </a>
      <a href="pass.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(180,145,60,0.35)" stroke-width="1.5">
          <rect x="2" y="7" width="20" height="14" rx="2"/>
          <path d="M16 7V5a2 2 0 00-4 0v2M12 12v4M10 14h4"/>
        </svg>
        <span class="nav-label">Pass</span>
      </a>
      <a href="profile.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(180,145,60,0.9)" stroke-width="1.5">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="nav-label" style="color:var(--gold);">Profile</span>
      </a>
    </nav>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    auth.onAuthStateChanged(async user => {
      if (!user) { window.location.href = 'welcome.html'; return; }

      const name  = user.displayName || user.email?.split('@')[0] || 'Guest';
      const email = user.email || 'Anonymous';
      const init  = name.charAt(0).toUpperCase();

      document.getElementById('profileName').textContent  = name;
      document.getElementById('profileEmail').textContent = email;
      document.getElementById('avatarInitial').textContent = init;

      if (user.photoURL) {
        document.getElementById('avatarRing').innerHTML = `<img src="${user.photoURL}" alt="${name}" />`;
      }

      if (!user.isAnonymous) {
        loadUserData(user.uid);
      } else {
        document.getElementById('savedGrid').innerHTML = `
          <div class="empty-saved" style="grid-column:span 2;">
            <a href="signup.html">Create an account</a> to save locations.
          </div>
        `;
      }

      // Partner count
      const pSnap = await db.collection('locations').where('halaOffer', '!=', '').get();
      document.getElementById('partnerCount').textContent = pSnap.size;
    });

    async function loadUserData(uid) {
      const snap = await db.collection('users').doc(uid).get();
      const data = snap.data() || {};
      const favs = data.favourites || [];

      document.getElementById('savedCount').textContent = favs.length;

      if (favs.length === 0) {
        document.getElementById('savedGrid').innerHTML = `
          <div class="empty-saved" style="grid-column:span 2;">
            No saved locations yet.<br />
            <a href="map.html" style="color:var(--gold-dim);">Explore the map →</a>
          </div>
        `;
        return;
      }

      // Load each saved location
      const promises = favs.slice(0, 6).map(id => db.collection('locations').doc(id).get());
      const docs = await Promise.all(promises);
      const locations = docs.map(d => ({ id: d.id, ...d.data() })).filter(l => l.name);

      document.getElementById('savedGrid').innerHTML = locations.map(loc => `
        <div class="saved-card" onclick="window.location.href='location.html?id=${loc.id}'">
          ${loc.imageURL
            ? `<img class="saved-img" src="${loc.imageURL}" alt="${loc.name}" loading="lazy" />`
            : `<div class="saved-img-ph">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(180,145,60,0.3)" stroke-width="1.2">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>
                </svg>
              </div>`
          }
          <div class="saved-body">
            <div class="saved-name">${loc.name}</div>
            <div class="saved-cat">${loc.category || ''}</div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
