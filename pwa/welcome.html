<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#040f04"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Hala"/>
<link rel="apple-touch-icon" href="assets/icons/icon-192.png"/>
  <title>Hala</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" href="assets/icons/favicon.png"/>
  <style>
    body { overflow: hidden; margin: 0; }

    .welcome-page {
      height: 100vh; width: 100vw;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 0 32px;
      position: relative;
    }

    /* Corner ornaments */
    .orn { position: fixed; width: 52px; height: 52px; pointer-events: none; opacity: 0.09; }
    .orn-tl { top: 22px; left: 22px; border-top: 1px solid #c9a84c; border-left: 1px solid #c9a84c; }
    .orn-tr { top: 22px; right: 22px; border-top: 1px solid #c9a84c; border-right: 1px solid #c9a84c; }
    .orn-bl { bottom: 22px; left: 22px; border-bottom: 1px solid #c9a84c; border-left: 1px solid #c9a84c; }
    .orn-br { bottom: 22px; right: 22px; border-bottom: 1px solid #c9a84c; border-right: 1px solid #c9a84c; }

    /* Logo zone */
    .logo-zone {
      display: flex; flex-direction: column; align-items: center;
      animation: fadeUp 0.9s ease forwards; opacity: 0;
    }

    .logo-img {
      width: 120px; height: 120px; object-fit: contain;
      filter: drop-shadow(0 0 28px rgba(201,168,76,0.42)) drop-shadow(0 0 60px rgba(201,168,76,0.18));
      margin-bottom: 28px;
    }

    /* Tagline */
    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 20px;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: rgba(201,168,76,0.62);
      text-align: center;
      line-height: 1.45;
      margin-bottom: 52px;
      animation: fadeUp 0.9s 0.18s ease forwards;
      opacity: 0;
    }

    /* Gold button */
    .btn-zone {
      width: 100%;
      animation: fadeUp 0.9s 0.35s ease forwards;
      opacity: 0;
    }

    .btn-welcome {
      display: block; width: 100%;
      padding: 17px;
      background: linear-gradient(135deg, #b8943e 0%, #e8c96a 50%, #b8943e 100%);
      border: none; border-radius: 16px;
      font-family: 'Inter', sans-serif;
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.22em; color: #0a1a05;
      text-transform: uppercase; text-align: center;
      text-decoration: none; cursor: pointer;
      position: relative; overflow: hidden;
      box-shadow: 0 6px 28px rgba(201,168,76,0.28);
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn-welcome:hover  { opacity: 0.9; }
    .btn-welcome:active { transform: scale(0.98); }

    /* Shimmer sweep */
    .btn-welcome::after {
      content: '';
      position: absolute; top: 0; left: -80%; width: 60%; height: 100%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.32), transparent);
      animation: shimmer 3s infinite;
    }
    @keyframes shimmer { 0%{left:-80%} 100%{left:160%} }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
    <button class="lang-toggle" id="langToggle" onclick="toggleLang()">AR</button>
  <div class="hala-bg">
    <div class="arabesque"></div>
    <div class="orn orn-tl"></div>
    <div class="orn orn-tr"></div>
    <div class="orn orn-bl"></div>
    <div class="orn orn-br"></div>

    <div class="welcome-page">
      <div class="logo-zone">
        <img src="assets/logo.png" alt="Hala" class="logo-img"/>
        <div class="tagline" data-en="Discover Saudi Arabia<br>Differently" data-ar="اكتشف المملكة العربية السعودية<br>بشكل مختلف">Discover Saudi Arabia<br>Differently</div>
      
      <div class="btn-zone">
        <a href="login.html" class="btn-welcome" data-en="Sign In / Create Account" data-ar="تسجيل الدخول / إنشاء حساب">Sign In / Create Account</a>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
  <script>
    // Skip welcome if already logged in
    auth.onAuthStateChanged(user => { if (user) window.location.href = 'home.html'; });
  </script>
  <script>
(function() {
  const lang = localStorage.getItem('hala_lang') || 'en';
  const btn = document.getElementById('langToggle');
  if (btn) btn.innerHTML = lang === 'ar'
  ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg> English'
  : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg> عربي';
  if (lang === 'ar') {
    document.documentElement.setAttribute('dir', 'rtl');
    document.documentElement.setAttribute('lang', 'ar');
  }
  document.querySelectorAll('[data-en]').forEach(el => {
    const val = lang === 'ar' ? (el.getAttribute('data-ar') || el.getAttribute('data-en')) : el.getAttribute('data-en');
    if (val) el.innerHTML = val;
  });
})();
</script>
</body>
</html>
