<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#040f04"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Hala"/>
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png"/>
  <title>Hala — Profile</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" href="assets/icons/favicon.png"/>
  <style>
    body { overflow-x: hidden; }
    .page { min-height: 100vh; padding: 0 0 90px; }

    .profile-hero { display: flex; flex-direction: column; align-items: center; padding: 60px 22px 28px; border-bottom: 1px solid rgba(201,168,76,0.08); margin-bottom: 10px; position: relative; }
    .avatar-ring { width: 86px; height: 86px; border-radius: 50%; background: rgba(201,168,76,0.1); border: 1.5px solid rgba(201,168,76,0.28); display: flex; align-items: center; justify-content: center; margin-bottom: 14px; overflow: hidden; box-shadow: 0 0 30px rgba(201,168,76,0.12); }
    .avatar-init { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; color: var(--gold); }
    .p-name { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 300; color: var(--text-pri); letter-spacing: 0.04em; text-align: center; margin-bottom: 3px; }
    .p-email { font-size: 12px; font-weight: 400; color: rgba(255,245,220,0.38); text-align: center; }
    .pass-badge { display: flex; align-items: center; gap: 6px; margin-top: 14px; background: rgba(201,168,76,0.08); backdrop-filter: blur(10px); border: 1px solid rgba(201,168,76,0.2); border-radius: 20px; padding: 6px 16px; font-size: 11px; font-weight: 500; color: rgba(201,168,76,0.65); letter-spacing: 0.08em; }
    .pass-dot { width: 6px; height: 6px; border-radius: 50%; background: #2ecc71; }

    .profile-section { margin: 0 16px 8px; background: rgba(10,25,10,0.55); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(201,168,76,0.13); border-radius: 20px; overflow: hidden; }
    .sec-header { padding: 16px 18px 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.28em; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid rgba(201,168,76,0.07); }

    .field-row { display: flex; align-items: center; padding: 15px 18px; border-bottom: 1px solid rgba(201,168,76,0.06); gap: 12px; }
    .field-row:last-child { border-bottom: none; }
    .field-icon { width: 34px; height: 34px; border-radius: 10px; background: rgba(201,168,76,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .field-body { flex: 1; min-width: 0; }
    .field-label { font-size: 10px; font-weight: 600; letter-spacing: 0.16em; color: rgba(255,245,220,0.38); text-transform: uppercase; margin-bottom: 3px; }
    .field-value { font-size: 14px; font-weight: 400; color: var(--text-pri); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .field-edit { background: none; border: none; cursor: pointer; color: rgba(201,168,76,0.4); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; transition: color 0.2s; padding: 4px; flex-shrink: 0; }
    .field-edit:hover { color: var(--gold-dim); }

    .edit-form { padding: 12px 18px 16px; border-top: 1px solid rgba(201,168,76,0.07); }
    .edit-form .form-input { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.14); color: var(--text-pri); font-size: 14px; }
    .edit-form .form-input:focus { border-color: rgba(201,168,76,0.5); }
    .edit-actions { display: flex; gap: 9px; margin-top: 10px; }
    .btn-save { flex: 1; padding: 11px; background: linear-gradient(135deg, #b8943e, #e8c96a, #b8943e); border: none; border-radius: var(--r-sm); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #0a1a05; cursor: pointer; text-transform: uppercase; }
    .btn-cancel { padding: 11px 18px; background: transparent; border: 1px solid rgba(201,168,76,0.18); border-radius: var(--r-sm); font-family: 'Inter', sans-serif; font-size: 12px; color: rgba(255,245,220,0.4); cursor: pointer; transition: border-color 0.2s; }
    .btn-cancel:hover { border-color: rgba(201,168,76,0.35); }

    .action-row { display: flex; align-items: center; gap: 13px; padding: 16px 18px; border-bottom: 1px solid rgba(201,168,76,0.06); cursor: pointer; transition: opacity 0.2s; }
    .action-row:hover { opacity: 0.72; }
    .action-row:last-child { border-bottom: none; }
    .action-icon { width: 34px; height: 34px; border-radius: 10px; background: rgba(201,168,76,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .action-icon.danger { background: rgba(220,80,80,0.08); }
    .action-label { flex: 1; font-size: 14px; color: var(--text-pri); }
    .action-label.danger { color: rgba(220,120,120,0.8); }
    .action-chevron { color: rgba(201,168,76,0.25); font-size: 20px; }
    .action-chevron.danger { color: rgba(220,100,100,0.25); }

    .modal-wrap { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .modal-wrap.open { opacity: 1; pointer-events: all; }
    .modal { width: 100%; max-width: 480px; background: rgba(8,20,8,0.98); backdrop-filter: blur(24px); border: 1px solid rgba(201,168,76,0.18); border-radius: 24px 24px 0 0; padding: 24px 22px 40px; transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.34,1.1,0.64,1); }
    .modal-wrap.open .modal { transform: translateY(0); }
    .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; color: var(--text-pri); margin-bottom: 6px; }
    .modal-sub { font-size: 12px; color: rgba(255,245,220,0.4); margin-bottom: 22px; line-height: 1.6; }
    .btn-danger { width: 100%; padding: 14px; background: rgba(220,60,60,0.15); border: 1px solid rgba(220,80,80,0.35); border-radius: var(--r-md); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; color: rgba(255,130,130,0.9); cursor: pointer; text-transform: uppercase; transition: all 0.2s; margin-bottom: 10px; }
    .btn-danger:hover { background: rgba(220,60,60,0.25); }
  </style>
</head>
<body>
<button class="lang-toggle" id="langToggle" onclick="toggleLang()">AR</button>
<div class="hala-bg">
  <div class="arabesque"></div>
  <div class="page">

    <div class="profile-hero">
      <div class="avatar-ring"><span class="avatar-init" id="avInit">?</span></div>
      <div class="p-name" id="pName">Loading…</div>
      <div class="p-email" id="pEmail"></div>
      <div class="pass-badge"><div class="pass-dot"></div><span data-en="Hala Pass · Active" data-ar="بطاقة هلا · نشطة">Hala Pass · Active</span></div>
    </div>

    <div class="profile-section">
      <div class="sec-header" data-en="Account Details" data-ar="تفاصيل الحساب">Account Details</div>

      <div class="field-row" id="nameRow">
        <div class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(201,168,76,0.6)" stroke-width="1.8"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
        <div class="field-body">
          <div class="field-label" data-en="Full Name" data-ar="الاسم الكامل">Full Name</div>
          <div class="field-value" id="nameVal">–</div>
        </div>
        <button class="field-edit" onclick="toggleEdit('name')" data-en="Edit" data-ar="تعديل">Edit</button>
      </div>
      <div id="nameEdit" style="display:none;">
        <div class="edit-form">
          <div class="input-wrap">
            <input class="form-input" type="text" id="nameInput" placeholder="Your full name"/>
          </div>
          <div class="edit-actions">
            <button class="btn-save" onclick="saveName()" data-en="Save" data-ar="حفظ">Save</button>
            <button class="btn-cancel" onclick="toggleEdit('name')" data-en="Cancel" data-ar="إلغاء">Cancel</button>
          </div>
        </div>
      </div>

      <div class="field-row">
        <div class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(201,168,76,0.6)" stroke-width="1.8"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div>
        <div class="field-body">
          <div class="field-label" data-en="Email Address" data-ar="البريد الإلكتروني">Email Address</div>
          <div class="field-value" id="emailVal">–</div>
        </div>
      </div>
    </div>

    <div class="profile-section">
      <div class="sec-header" data-en="Security" data-ar="الأمان">Security</div>
      <div class="field-row" id="passRow">
        <div class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(201,168,76,0.6)" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div>
        <div class="field-body">
          <div class="field-label" data-en="Password" data-ar="كلمة المرور">Password</div>
          <div class="field-value">••••••••</div>
        </div>
        <button class="field-edit" onclick="toggleEdit('pass')" data-en="Change" data-ar="تغيير">Change</button>
      </div>
      <div id="passEdit" style="display:none;">
        <div class="edit-form">
          <div class="form-group">
            <label class="form-label" style="color:rgba(255,245,220,0.55);" data-en="Current Password" data-ar="كلمة المرور الحالية">Current Password</label>
            <div class="input-wrap">
              <input class="form-input" type="password" id="curPass" placeholder="Current password" style="padding-right:44px;"/>
              <button class="eye-btn" onclick="toggleEye('curPass',this)" tabindex="-1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" style="color:rgba(255,245,220,0.55);" data-en="New Password" data-ar="كلمة المرور الجديدة">New Password</label>
            <div class="input-wrap">
              <input class="form-input" type="password" id="newPass" placeholder="Min. 8 characters" style="padding-right:44px;"/>
              <button class="eye-btn" onclick="toggleEye('newPass',this)" tabindex="-1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
          </div>
          <div class="edit-actions">
            <button class="btn-save" onclick="savePassword()" data-en="Update" data-ar="تحديث">Update</button>
            <button class="btn-cancel" onclick="toggleEdit('pass')" data-en="Cancel" data-ar="إلغاء">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <div class="profile-section">
      <div class="action-row" onclick="doSignOut()">
        <div class="action-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(201,168,76,0.6)" stroke-width="1.8"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></div>
        <span class="action-label" data-en="Sign Out" data-ar="تسجيل الخروج">Sign Out</span>
        <span class="action-chevron">›</span>
      </div>
      <div class="action-row" onclick="openDeleteModal()">
        <div class="action-icon danger"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(220,100,100,0.7)" stroke-width="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg></div>
        <span class="action-label danger" data-en="Delete Account" data-ar="حذف الحساب">Delete Account</span>
        <span class="action-chevron danger">›</span>
      </div>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="rgba(201,168,76,0.32)" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg><span class="nav-lbl" data-en="Home" data-ar="الرئيسية">Home</span></a>
    <a href="map.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="rgba(201,168,76,0.32)" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg><span class="nav-lbl" data-en="Map" data-ar="الخريطة">Map</span></a>
    <a href="card.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="rgba(201,168,76,0.32)" stroke-width="1.5"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-4 0v2"/></svg><span class="nav-lbl" data-en="Card" data-ar="البطاقة">Card</span></a>
    <a href="profile.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="rgba(201,168,76,0.9)" stroke-width="1.5"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="nav-lbl" style="color:var(--gold);" data-en="Profile" data-ar="الملف">Profile</span></a>
  </nav>

  <div class="modal-wrap" id="deleteModal">
    <div class="modal">
      <div class="modal-title" data-en="Delete Account" data-ar="حذف الحساب">Delete Account</div>
      <div class="modal-sub" data-en="This will permanently delete your account and all saved data. This cannot be undone." data-ar="سيؤدي هذا إلى حذف حسابك وجميع بياناتك المحفوظة بشكل دائم. لا يمكن التراجع عن هذا الإجراء.">This will permanently delete your account and all saved data. This cannot be undone.</div>
      <div class="form-group">
        <label class="form-label" style="color:rgba(255,245,220,0.5);" data-en="Confirm your password" data-ar="أكّد كلمة المرور">Confirm your password</label>
        <div class="input-wrap">
          <input class="form-input" type="password" id="deletePass" placeholder="Your password" style="padding-right:44px;"/>
          <button class="eye-btn" onclick="toggleEye('deletePass',this)" tabindex="-1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <button class="btn-danger" onclick="deleteAccount()" data-en="Delete My Account" data-ar="احذف حسابي">Delete My Account</button>
      <button class="btn-cancel" style="width:100%;padding:14px;" onclick="closeDeleteModal()" data-en="Cancel" data-ar="إلغاء">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
  let currentUser;

  requireAuth().then(user => {
    currentUser = user;
    const name = user.displayName || '';
    document.getElementById('avInit').textContent   = (name || user.email).charAt(0).toUpperCase();
    document.getElementById('pName').textContent    = name || 'No name set';
    document.getElementById('pEmail').textContent   = user.email;
    document.getElementById('nameVal').textContent  = name || '–';
    document.getElementById('emailVal').textContent = user.email;
    document.getElementById('nameInput').value      = name;
  });

  function toggleEdit(type) {
    const editEl = document.getElementById(type + 'Edit');
    editEl.style.display = editEl.style.display !== 'none' ? 'none' : 'block';
  }

  function toggleEye(id, btn) {
    const inp = document.getElementById(id);
    inp.type = inp.type === 'text' ? 'password' : 'text';
    btn.style.color = inp.type === 'text' ? 'rgba(201,168,76,0.7)' : 'rgba(255,245,220,0.35)';
  }

  async function saveName() {
    const lang = localStorage.getItem('hala_lang') || 'en';
    const name = document.getElementById('nameInput').value.trim();
    if (!name) return showToast(lang === 'ar' ? 'يرجى إدخال اسمك.' : 'Please enter your name.', true);
    setLoading(true);
    try {
      await currentUser.updateProfile({ displayName: name });
      document.getElementById('pName').textContent   = name;
      document.getElementById('nameVal').textContent = name;
      document.getElementById('avInit').textContent  = name.charAt(0).toUpperCase();
      toggleEdit('name');
      showToast(lang === 'ar' ? 'تم تحديث الاسم.' : 'Name updated.');
    } catch(e) { showToast(lang === 'ar' ? 'تعذر تحديث الاسم.' : 'Could not update name.', true); }
    setLoading(false);
  }

  async function savePassword() {
    const lang    = localStorage.getItem('hala_lang') || 'en';
    const curPass = document.getElementById('curPass').value;
    const newPass = document.getElementById('newPass').value;
    if (!curPass || !newPass) return showToast(lang === 'ar' ? 'يرجى ملء جميع الحقول.' : 'Fill in both fields.', true);
    if (newPass.length < 8)   return showToast(lang === 'ar' ? 'كلمة المرور يجب أن تكون 8 أحرف على الأقل.' : 'New password must be at least 8 characters.', true);
    setLoading(true);
    try {
      const cred = firebase.auth.EmailAuthProvider.credential(currentUser.email, curPass);
      await currentUser.reauthenticateWithCredential(cred);
      await currentUser.updatePassword(newPass);
      toggleEdit('pass');
      document.getElementById('curPass').value = '';
      document.getElementById('newPass').value = '';
      showToast(lang === 'ar' ? 'تم تحديث كلمة المرور.' : 'Password updated.');
    } catch(e) {
      if (e.code === 'auth/wrong-password') showToast(lang === 'ar' ? 'كلمة المرور الحالية غير صحيحة.' : 'Current password is incorrect.', true);
      else showToast(lang === 'ar' ? 'تعذر تحديث كلمة المرور.' : 'Could not update password.', true);
    }
    setLoading(false);
  }

  async function doSignOut() {
    await auth.signOut();
    window.location.href = 'login.html';
  }

  function openDeleteModal()  { document.getElementById('deleteModal').classList.add('open'); }
  function closeDeleteModal() { document.getElementById('deleteModal').classList.remove('open'); }

  async function deleteAccount() {
    const lang = localStorage.getItem('hala_lang') || 'en';
    const pass = document.getElementById('deletePass').value;
    if (!pass) return showToast(lang === 'ar' ? 'أدخل كلمة المرور للتأكيد.' : 'Enter your password to confirm.', true);
    setLoading(true);
    try {
      const cred = firebase.auth.EmailAuthProvider.credential(currentUser.email, pass);
      await currentUser.reauthenticateWithCredential(cred);
      await currentUser.delete();
      window.location.href = 'login.html';
    } catch(e) {
      setLoading(false);
      if (e.code === 'auth/wrong-password') showToast(lang === 'ar' ? 'كلمة المرور غير صحيحة.' : 'Incorrect password.', true);
      else showToast(lang === 'ar' ? 'تعذر حذف الحساب.' : 'Could not delete account.', true);
    }
  }
</script>

<script>
(function() {
  const lang = localStorage.getItem('hala_lang') || 'en';
  const btn = document.getElementById('langToggle');
  if (btn) btn.innerHTML = lang === 'ar'
    ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg> إنجليزي'
    : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg> عربي';
  if (lang === 'ar') {
    document.documentElement.setAttribute('dir', 'rtl');
    document.documentElement.setAttribute('lang', 'ar');
  }
  document.querySelectorAll('[data-en]').forEach(el => {
    const val = lang === 'ar' ? (el.getAttribute('data-ar') || el.getAttribute('data-en')) : el.getAttribute('data-en');
    if (val) el.innerHTML = val;
  });
})();
</script>
</body>
</html>
