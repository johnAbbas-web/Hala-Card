<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#040f04"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Hala"/>
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png"/>
  <title>Hala — Home</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" href="assets/icons/favicon.png"/>
  <style>
    body { overflow-x: hidden; }
    .page { min-height: 100vh; padding-bottom: 90px; }

    .hero-card {
      position: relative;
      height: 52vw; max-height: 240px; min-height: 180px;
      overflow: hidden;
    }
    .hero-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-img-fallback { width: 100%; height: 100%; background: linear-gradient(135deg, #0a2a0a 0%, #1a5a1a 40%, #0d3a0d 100%); position: absolute; inset: 0; }
    .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(4,10,4,0.28) 0%, rgba(4,10,4,0.15) 30%, rgba(4,10,4,0.72) 75%, rgba(4,10,4,0.97) 100%);
    }
    .hero-content { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 20px 22px; }
    .hero-eyebrow { font-size: 9px; font-weight: 600; letter-spacing: 0.38em; color: rgba(201,168,76,0.58); text-transform: uppercase; margin-bottom: 5px; }
    .hero-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; color: rgba(255,245,220,0.96); line-height: 1.2; }
    .hero-title span { color: var(--gold); }
    .hero-sub { font-size: 11px; font-weight: 400; color: rgba(255,245,220,0.42); margin-top: 5px; letter-spacing: 0.04em; }

    .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 16px 16px 0; }
    .stat-card {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(201,168,76,0.14);
      border-radius: 16px; padding: 14px 10px; text-align: center;
      cursor: pointer; transition: border-color 0.2s, transform 0.15s, background 0.2s;
      text-decoration: none; display: block;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 4px 16px rgba(0,0,0,0.2);
    }
    .stat-card:hover { border-color: rgba(201,168,76,0.32); transform: translateY(-2px); background: rgba(255,255,255,0.07); }
    .stat-icon { width: 32px; height: 32px; border-radius: 10px; background: rgba(201,168,76,0.1); display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; }
    .stat-n { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 400; color: var(--gold); line-height: 1; margin-bottom: 3px; }
    .stat-l { font-size: 9px; font-weight: 600; letter-spacing: 0.16em; color: rgba(255,245,220,0.42); text-transform: uppercase; }

    .sec { padding: 22px 16px 0; }
    .sec-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .sec-link { font-size: 11px; font-weight: 500; color: rgba(201,168,76,0.45); cursor: pointer; letter-spacing: 0.05em; transition: color 0.2s; text-decoration: none; }
    .sec-link:hover { color: var(--gold); }

    .discover-card {
      margin: 20px 16px 0; border-radius: 22px; overflow: hidden;
      position: relative; height: 160px; cursor: pointer;
      text-decoration: none; display: block; transition: transform 0.2s;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }
    .discover-card:hover { transform: translateY(-2px); }
    .discover-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .discover-bg-fallback { position: absolute; inset: 0; background: linear-gradient(135deg, #071a07 0%, #0f3a10 30%, #1a5a1a 60%, #0a2a0a 100%); }
    .discover-overlay { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(4,12,4,0.5) 0%, rgba(10,30,10,0.28) 50%, rgba(4,12,4,0.55) 100%); }
    .discover-glass { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 24px 26px; }
    .discover-eyebrow { font-size: 9px; font-weight: 700; letter-spacing: 0.38em; color: rgba(201,168,76,0.65); text-transform: uppercase; margin-bottom: 8px; }
    .discover-title { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 300; color: rgba(255,245,220,0.96); line-height: 1.25; margin-bottom: 14px; }
    .discover-btn { display: inline-flex; align-items: center; gap: 7px; background: rgba(201,168,76,0.18); backdrop-filter: blur(10px); border: 1px solid rgba(201,168,76,0.38); border-radius: 50px; padding: 7px 16px; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: var(--gold); text-transform: uppercase; align-self: flex-start; }
    .discover-dots { position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(circle, rgba(201,168,76,0.14) 1px, transparent 1px); background-size: 22px 22px; opacity: 0.5; }

    .offers-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 4px; scrollbar-width: none; }
    .offers-scroll::-webkit-scrollbar { display: none; }
    .offer-card { flex-shrink: 0; width: calc(100vw - 64px); max-width: 340px; display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(201,168,76,0.14); border-radius: 16px; padding: 12px; cursor: pointer; transition: border-color 0.2s, transform 0.15s; box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 4px 16px rgba(0,0,0,0.18); }
    .offer-card:hover { border-color: rgba(201,168,76,0.32); transform: translateY(-1px); }
    .offer-img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; flex-shrink: 0; background: rgba(201,168,76,0.08); }
    .offer-img-ph { width: 64px; height: 64px; border-radius: 12px; flex-shrink: 0; background: linear-gradient(135deg, rgba(201,168,76,0.1), rgba(26,74,26,0.4)); display: flex; align-items: center; justify-content: center; }
    .offer-body { flex: 1; min-width: 0; }
    .offer-cat { font-size: 9px; font-weight: 600; letter-spacing: 0.2em; color: rgba(201,168,76,0.48); text-transform: uppercase; margin-bottom: 3px; }
    .offer-name { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 400; color: rgba(255,245,220,0.95); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
    .offer-deal { font-size: 11px; font-weight: 500; color: var(--gold-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .offer-expiry { font-size: 10px; color: rgba(255,245,220,0.28); margin-top: 3px; }

    .favs-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 4px; scrollbar-width: none; }
    .favs-scroll::-webkit-scrollbar { display: none; }
    .fav-card { flex-shrink: 0; width: 150px; background: rgba(255,255,255,0.04); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(201,168,76,0.12); border-radius: 16px; overflow: hidden; cursor: pointer; transition: border-color 0.2s, transform 0.18s; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 4px 14px rgba(0,0,0,0.18); }
    .fav-card:hover { border-color: rgba(201,168,76,0.3); transform: translateY(-2px); }
    .fav-img { width: 100%; height: 90px; object-fit: cover; display: block; background: rgba(201,168,60,0.07); }
    .fav-img-ph { width: 100%; height: 90px; background: linear-gradient(135deg, rgba(201,168,76,0.08), rgba(26,74,26,0.3)); display: flex; align-items: center; justify-content: center; }
    .fav-body { padding: 10px 11px 12px; }
    .fav-cat { font-size: 8px; font-weight: 600; letter-spacing: 0.18em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 3px; }
    .fav-name { font-family: 'Cormorant Garamond', serif; font-size: 15px; color: var(--text-pri); line-height: 1.25; }

    .empty-state { padding: 26px 0; text-align: center; font-size: 13px; color: rgba(255,245,220,0.28); line-height: 1.8; }
    .empty-state a { color: rgba(201,168,76,0.55); text-decoration: none; }
  </style>
</head>
<body>
<button class="lang-toggle" id="langToggle" onclick="toggleLang()">AR</button>
<div class="hala-bg">
  <div class="arabesque"></div>
  <div class="page">

    <div class="hero-card">
      <img src="assets/hero.webp" alt="" class="hero-img" onerror="this.style.display='none';document.getElementById('heroFallback').style.display='block'"/>
      <div id="heroFallback" class="hero-img-fallback" style="display:none;"></div>
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <div class="hero-eyebrow">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</div>
        <div class="hero-title" id="heroTitle">Welcome to Hala,<br><span id="heroName">…</span></div>
        <div class="hero-sub" id="heroDate"></div>
      </div>
    </div>
    
    <a href="map.html" class="discover-card">
      <img src="assets/mapbg.webp" alt="" class="discover-bg" onerror="this.style.display='none';document.getElementById('discoverFallback').style.display='block'"/>
      <div id="discoverFallback" class="discover-bg-fallback" style="display:none;"></div>
      <div class="discover-dots"></div>
      <div class="discover-overlay"></div>
      <div class="discover-glass">
        <div class="discover-eyebrow" data-en="Interactive Map" data-ar="الخريطة التفاعلية">Interactive Map</div>
        <div class="discover-title" data-en="Discover Madinah<br>Differently" data-ar="اكتشف المدينة المنورة<br>بشكل مختلف">Discover Madinah<br>Differently</div>
        <div class="discover-btn">
          <span data-en="Explore Now" data-ar="استكشف الآن">Explore Now</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
      </div>
    </a>

    <div class="stats-row">
      <a href="#favourites" class="stat-card" onclick="scrollToFavs(event)">
        <div class="stat-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="rgba(201,168,76,0.7)" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg></div>
        <div class="stat-n" id="statFavs">0</div>
        <div class="stat-l" data-en="Favourites" data-ar="المفضلة">Favourites</div>
      </a>
      <a href="map.html" class="stat-card">
        <div class="stat-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(201,168,76,0.7)" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
        <div class="stat-n" id="statPlaces">–</div>
        <div class="stat-l" data-en="Explore Map" data-ar="استكشف الخريطة">Explore Map</div>
      </a>
      <a href="card.html" class="stat-card">
        <div class="stat-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(201,168,76,0.7)" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-4 0v2"/></svg></div>
        <div class="stat-n" id="statOffers">–</div>
        <div class="stat-l" data-en="Hala Pass" data-ar="بطاقة هلا">Hala Pass</div>
      </a>
    </div>

    <div class="sec">
      <div class="sec-hdr">
        <div class="sec-label" data-en="Featured Offers" data-ar="العروض المميزة">Featured Offers</div>
        <a href="card.html" class="sec-link" data-en="View all →" data-ar="عرض الكل →">View all →</a>
      </div>
    </div>
    <div class="offers-scroll" id="offersScroll">
      <div style="width:300px;height:88px;border-radius:16px;flex-shrink:0;" class="skeleton"></div>
      <div style="width:300px;height:88px;border-radius:16px;flex-shrink:0;" class="skeleton"></div>
    </div>

    <div class="sec" id="favourites">
      <div class="sec-hdr">
        <div class="sec-label" data-en="Your Favourites" data-ar="مفضلتك">Your Favourites</div>
        <a href="map.html" class="sec-link" data-en="Explore →" data-ar="استكشف →">Explore →</a>
      </div>
    </div>
    <div class="favs-scroll" id="favsScroll">
      <div style="width:150px;height:150px;border-radius:16px;flex-shrink:0;" class="skeleton"></div>
      <div style="width:150px;height:150px;border-radius:16px;flex-shrink:0;" class="skeleton"></div>
      <div style="width:150px;height:150px;border-radius:16px;flex-shrink:0;" class="skeleton"></div>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="rgba(201,168,76,0.9)" stroke="none"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span class="nav-lbl" style="color:var(--gold);" data-en="Home" data-ar="الرئيسية">Home</span>
    </a>
    <a href="map.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="rgba(201,168,76,0.32)" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span class="nav-lbl" data-en="Map" data-ar="الخريطة">Map</span>
    </a>
    <a href="card.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="rgba(201,168,76,0.32)" stroke-width="1.5"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-4 0v2"/></svg>
      <span class="nav-lbl" data-en="Card" data-ar="البطاقة">Card</span>
    </a>
    <a href="profile.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="rgba(201,168,76,0.32)" stroke-width="1.5"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="nav-lbl" data-en="Profile" data-ar="الملف">Profile</span>
    </a>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
  const CAT_AR = {
    'Museums & Culture': 'المتاحف والثقافة',
    'Historic & Religious Sites': 'المواقع التاريخية والدينية',
    'Nature & Outdoor': 'الطبيعة والهواء الطلق',
    'Cafes & Coffee Spots': 'المقاهي',
    'Restaurants & Dining': 'المطاعم',
    'Desserts': 'الحلويات',
    'Shopping & Malls': 'التسوق',
  };

  const days_en   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const days_ar   = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const months_en = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const months_ar = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const now = new Date();
  const lang = localStorage.getItem('hala_lang') || 'en';

  if (lang === 'ar') {
    document.getElementById('heroDate').textContent = days_ar[now.getDay()] + ' · ' + now.getDate() + ' ' + months_ar[now.getMonth()];
  } else {
    document.getElementById('heroDate').textContent = days_en[now.getDay()] + ' · ' + now.getDate() + ' ' + months_en[now.getMonth()];
  }

  function scrollToFavs(e) {
    e.preventDefault();
    document.getElementById('favourites').scrollIntoView({ behavior: 'smooth' });
  }

  requireAuth().then(async user => {
    const name = user.displayName || user.email.split('@')[0];
    document.getElementById('heroName').textContent = name;
    if (lang === 'ar') {
      document.getElementById('heroTitle').innerHTML = 'أهلاً في هلا،<br><span id="heroName">' + name + '</span>';
    }

    try {
      const [placesRes, favsRes] = await Promise.all([
        apiCall('/places?has_offer=1'),
        apiCall('/favourites')
      ]);
      const favs   = favsRes.favourites || [];
      const offers = placesRes.places   || [];

      document.getElementById('statFavs').textContent   = favs.length;
      document.getElementById('statPlaces').textContent = placesRes.total || '–';
      document.getElementById('statOffers').textContent = offers.length   || '–';

      renderOffers(offers);
      renderFavourites(favs);
    } catch(e) {
      renderOffers([]);
      renderFavourites([]);
    }
  });

  function renderOffers(places) {
    const c = document.getElementById('offersScroll');
    if (!places.length) {
      c.innerHTML = `<div class="empty-state" style="padding:20px 16px;">${lang === 'ar' ? 'لا توجد عروض مميزة بعد.' : 'No featured offers yet.'}</div>`;
      return;
    }
    c.innerHTML = places.map(p => {
      const name  = (lang === 'ar' && p.name_ar)  ? p.name_ar  : p.name;
      const offer = (lang === 'ar' && p.offer_ar) ? p.offer_ar : p.offer;
      const cat   = (lang === 'ar' && CAT_AR[p.category]) ? CAT_AR[p.category] : (p.category || 'Partner');
      return `
        <div class="offer-card" onclick="goToPlace(${p.id})">
          ${p.image_url
            ? `<img class="offer-img" src="${p.image_url}" alt="${name}" loading="lazy"/>`
            : `<div class="offer-img-ph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(201,168,76,0.3)" stroke-width="1.2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></div>`}
          <div class="offer-body">
            <div class="offer-cat">${cat}</div>
            <div class="offer-name">${name}</div>
            <div class="offer-deal">${offer}</div>
            ${p.offer_expiry ? `<div class="offer-expiry">${lang === 'ar' ? 'حتى' : 'Until'} ${p.offer_expiry}</div>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  function renderFavourites(favs) {
    const c = document.getElementById('favsScroll');
    if (!favs.length) {
      c.innerHTML = `<div class="empty-state"><a href="map.html">${lang === 'ar' ? 'استكشف الخريطة' : 'Explore the map'}</a> ${lang === 'ar' ? 'واحفظ أماكنك المفضلة هنا.' : 'and save your favourite places here.'}</div>`;
      return;
    }
    c.innerHTML = favs.map(p => {
      const name = (lang === 'ar' && p.name_ar) ? p.name_ar : p.name;
      const cat  = (lang === 'ar' && CAT_AR[p.category]) ? CAT_AR[p.category] : (p.category || '');
      return `
        <div class="fav-card" onclick="goToPlace(${p.id})">
          ${p.image_url
            ? `<img class="fav-img" src="${p.image_url}" alt="${name}" loading="lazy"/>`
            : `<div class="fav-img-ph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(201,168,76,0.3)" stroke-width="1.2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></div>`}
          <div class="fav-body">
            <div class="fav-cat">${cat}</div>
            <div class="fav-name">${name}</div>
          </div>
        </div>`;
    }).join('');
  }

  function goToPlace(id) {
    sessionStorage.setItem('hala_open_place', String(id));
    window.location.href = 'map.html';
  }
</script>

<script>
(function() {
  const lang = localStorage.getItem('hala_lang') || 'en';
  const btn = document.getElementById('langToggle');
  if (btn) btn.innerHTML = lang === 'ar'
    ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg> إنجليزي'
    : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg> عربي';
  if (lang === 'ar') {
    document.documentElement.setAttribute('dir', 'rtl');
    document.documentElement.setAttribute('lang', 'ar');
  }
  document.querySelectorAll('[data-en]').forEach(el => {
    const val = lang === 'ar' ? (el.getAttribute('data-ar') || el.getAttribute('data-en')) : el.getAttribute('data-en');
    if (val) el.innerHTML = val;
  });
})();
</script>
</body>
</html>
