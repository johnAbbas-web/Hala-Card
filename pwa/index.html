<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#040f04"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Hala"/>
<link rel="apple-touch-icon" href="assets/icons/icon-192.png"/>
  <title>Hala</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" href="assets/icons/favicon.png"/>
  <style>
    body { overflow: hidden; margin: 0; }

    .splash {
      height: 100vh; width: 100vw;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(ellipse 120% 80% at 50% -10%, rgba(22,75,22,0.95) 0%, transparent 55%),
        radial-gradient(ellipse 80%  60% at 85%  55%, rgba(15,52,15,0.45) 0%, transparent 50%),
        radial-gradient(ellipse 60%  80% at 15%  80%, rgba(10,36,10,0.55) 0%, transparent 50%),
        linear-gradient(180deg, #071807 0%, #040f04 100%);
      position: relative;
    }

    /* Subtle diagonal light rays */
    .splash::before {
      content: '';
      position: absolute; inset: 0;
      background:
        conic-gradient(from 210deg at 50% 15%, transparent 0deg, rgba(201,168,76,0.04) 18deg, transparent 36deg),
        conic-gradient(from 30deg  at 50% 15%, transparent 0deg, rgba(201,168,76,0.03) 25deg, transparent 50deg);
      pointer-events: none;
    }

    .logo-wrap {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      animation: splashReveal 1.4s cubic-bezier(0.22,1,0.36,1) forwards;
      opacity: 0; position: relative; z-index: 1;
    }

    @keyframes splashReveal {
      0%   { opacity: 0; transform: scale(0.92) translateY(16px); }
      100% { opacity: 1; transform: scale(1)    translateY(0); }
    }

    .logo-img {
      width: 150px; height: 150px;
      object-fit: contain;
      filter:
        drop-shadow(0 0 40px rgba(201,168,76,0.5))
        drop-shadow(0 0 90px rgba(201,168,76,0.22));
    }

    /* Corner ornaments */
    .orn { position: fixed; width: 52px; height: 52px; pointer-events: none; opacity: 0.09; }
    .orn-tl { top: 22px; left: 22px; border-top: 1px solid #c9a84c; border-left: 1px solid #c9a84c; }
    .orn-tr { top: 22px; right: 22px; border-top: 1px solid #c9a84c; border-right: 1px solid #c9a84c; }
    .orn-bl { bottom: 22px; left: 22px; border-bottom: 1px solid #c9a84c; border-left: 1px solid #c9a84c; }
    .orn-br { bottom: 22px; right: 22px; border-bottom: 1px solid #c9a84c; border-right: 1px solid #c9a84c; }

    /* Bottom gold line */
    .splash-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(to right, transparent, #c9a84c, transparent);
      transform: scaleX(0); transform-origin: center;
      animation: barIn 1.4s 0.6s ease forwards;
    }
    @keyframes barIn {
      0%   { transform: scaleX(0); opacity: 0.8; }
      100% { transform: scaleX(1); opacity: 0; }
    }
  </style>
</head>
<body>
  
  <div class="splash">
    <div class="logo-wrap">
      <img src="assets/logo.png" alt="Hala" class="logo-img"/>
    </div>
  </div>

  <div class="splash-bar"></div>
  <div class="orn orn-tl"></div>
  <div class="orn orn-tr"></div>
  <div class="orn orn-bl"></div>
  <div class="orn orn-br"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    window.addEventListener('load', () => {
      auth.onAuthStateChanged(user => {
        setTimeout(() => {
          window.location.href = user ? 'home.html' : 'welcome.html';
        }, 2600);
      });
    });
  </script>
</body>
</html>
